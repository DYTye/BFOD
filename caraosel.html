<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <div class="relative w-full max-w-xl mx-auto overflow-hidden rounded-xl">
  <!-- Wrapper -->
  <div id="carousel" class="flex transition-transform">
    <img src="https://academy.devatastudio.com/wp-content/uploads/2025/11/Instagram-post-1.jpg" class="w-full flex-shrink-0" />
    <img src="https://academy.devatastudio.com/wp-content/uploads/2025/11/Instagram-post-2.png" class="w-full flex-shrink-0" />
    <img src="https://academy.devatastudio.com/wp-content/uploads/2025/11/Instagram-post-3.png" class="w-full flex-shrink-0" />
    <img src="https://academy.devatastudio.com/wp-content/uploads/2025/11/Instagram-post-4.png" class="w-full flex-shrink-0" />
    <img src="https://academy.devatastudio.com/wp-content/uploads/2025/11/Instagram-post-5.png" class="w-full flex-shrink-0" />

  </div>

  <!-- Prev -->
  <button
    id="prevBtn"
    class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/50 text-white px-3 py-2 rounded-full"
  >
    ‹
  </button>

  <!-- Next -->
  <button
    id="nextBtn"
    class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/50 text-white px-3 py-2 rounded-full"
  >
    ›
  </button>

  <script>
  const carousel = document.getElementById("carousel");
  const totalSlides = carousel.children.length;
  let current = 0;

  function updateCarousel() {
    carousel.style.transform = `translateX(-${current * 100}%)`;
  }

  document.getElementById("nextBtn").addEventListener("click", () => {
    current = (current + 1) % totalSlides;
    updateCarousel();
  });

  document.getElementById("prevBtn").addEventListener("click", () => {
    current = (current - 1 + totalSlides) % totalSlides;
    updateCarousel();
  });

</script>
</div>
</body>
</html>
